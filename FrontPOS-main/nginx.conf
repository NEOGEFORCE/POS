# =============================================================================
# nginx.conf — proceso principal del contenedor pos-frontend
# =============================================================================
# La configuración del server block vive en docker/default.conf.template; el
# entrypoint oficial de la imagen nginx lo renderiza con envsubst usando las
# variables declaradas en NGINX_ENVSUBST_FILTER (ver Dockerfile).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- Logs ----------
    # El formato por defecto es suficiente. Mandamos access a stdout para que
    # el orquestador (docker/compose/journald) lo recoja sin tocar volumen.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ---------- Core ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;
    server_tokens   off;

    keepalive_timeout  65;

    # Límite global del body: 25 MB cubre con holgura el POST de /inventory/
    # scan-invoice (backend corta a 14 MB vía MaxBytesReader). nginx aborta
    # antes de hablar con upstream si lo exceden, con 413.
    client_max_body_size 25m;
    client_body_buffer_size 1m;

    # ---------- Compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- Server block ----------
    # Montado desde /etc/nginx/conf.d/*.conf tras envsubst del template.
    include /etc/nginx/conf.d/*.conf;
}
